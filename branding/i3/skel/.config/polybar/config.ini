include-file = $HOME/.config/polybar/colors.ini

[settings]
screenchange-reload = true

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over


pseudo-transparency = true

[bar/main]
monitor = ${env:MONITOR:}
monitor-fallback =
monitor-strict = false
monitor-exact = true
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 31

offset-x = 0
offset-y = 0

background = ${color.transparent}
foreground = ${color.foreground}

radius = 0.0


line-size = 2
line-color = ${color.transparent}

border-top-size = 8
border-top-color = ${color.transparent}
border-left-size = 8
border-left-color = ${color.transparent}
border-right-size = 8
border-right-color = ${color.transparent}

padding = 0

font-0 = "Iosevka Nerd Font:size=12;4"
font-1 = "Iosevka Nerd Font:style=Regular:size=18;4"
font-2 = "feather:size=13;5"


modules-left = l menu r s l i3 r s installer
modules-center = l date r
modules-right = l cpu s2 s2 temperature s2 s2 ram s2 s2 pulseaudio r s tray_transparent


dim-value = 1.0
wm-name = i3
locale =

dpi-x = 96
dpi-y = 96

enable-ipc = true


double-click-interval = 400

cursor-click = pointer
cursor-scroll = ns-resize

[module/l]
type = custom/text
format-background = ${color.transparent}
format-foreground = ${color.background}
format = 
format-font = 2

[module/r]
type = custom/text
format-background = ${color.transparent}
format-foreground = ${color.background}
format = 
format-font = 2

[module/s]
type = custom/text
format = " "

[module/s2]
type = custom/text
format = " "

format-foreground = ${color.background}
format-background = ${color.background}

[module/tray_transparent]
type = internal/tray

format-background = ${color.transparent}

tray-foreground = ${color.transparent}
tray-background = ${color.transparent}

tray-padding = 5px
tray-spacing = 0
tray-size = 66%

[module/pulseaudio]
type = internal/pulseaudio
interval = 5

use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${color.background}
format-muted = <label-muted>
format-muted-background = ${color.background}

label-volume = %percentage%%
label-muted = 
label-muted-foreground =${color.red}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-headphones-0 = 
ramp-volume-foreground = ${color.blue}

[module/cpu]
type = internal/cpu
interval = 1

warn-percentage = 90

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.green}
format-background = ${color.background}
label = "%percentage%%"

[module/date]
type = internal/date
interval = 1


date = %a %d %b
time = %H:%M
date-alt = %A %d %B %Y
time-alt = %H:%M:%S

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.red}
format-background = ${color.background}

label = %date% %time%

[module/i3]
type = internal/i3

pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = true
reverse-scroll = false
fuzzy-match = false

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default = 


format = <label-state><label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${color.background}
label-mode-foreground = ${color.foreground}

label-focused = %icon%
label-focused-foreground = ${color.green}
label-focused-background = ${color.background}
label-focused-underline =  ${color.green}
label-focused-padding = 1

label-unfocused = %icon%
label-unfocused-padding = 1
label-unfocused-background = ${color.background}

label-visible = %icon%
label-visible-underline = ${color.purple}
label-visible-padding = 1
label-visible-foreground = ${color.purple}
label-visible-background = ${color.background}

label-urgent = %icon%
label-urgent-foreground = ${color.red}
label-urgent-background = ${color.background}
label-urgent-padding = 1

[module/ram]
type = internal/memory
interval = 1

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.purple}
format-background = ${color.background}

label = "%gb_used%"

[module/menu]
type = custom/text

format = <label>
label = ""

format-background = ${color.background}
format-foreground = ${color.yellow}


click-left = rofi -show drun -no-default-config -config ~/.config/rofi/dmenu.rasi
click-middle = i3-msg workspace $(comm -23 <(seq 1 100) <(i3-msg -t get_workspaces | jq '.[].num' | sort -n) | head -n 1)
click-right = rofi-powermenu

[module/installer]
type = custom/script
exec = /usr/local/bin/vigil-live-installer-label
interval = 10
click-left = /usr/bin/liveinst
format-foreground = ${color.foreground}
format-background = ${color.background}
format-padding = 1

[module/temperature]
type = custom/script
exec = /usr/local/bin/vigil-temperature
interval = 5
format-background = ${color.background}
format-foreground = ${color.cyan}
